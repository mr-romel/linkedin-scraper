name: LinkedIn Public Decision Maker Discovery

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum public LinkedIn candidates
        required: false
        default: '200'
      engine:
        description: Search engine
        required: false
        default: 'google'
  push:
    branches:
      - main
    paths-ignore:
      - 'artifacts/**'
  schedule:
    - cron: '37 7 * * 1-5'

concurrency:
  group: linkedin-public-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINKEDIN_LEAD_LIMIT: ${{ github.event.inputs.limit || '200' }}
      LINKEDIN_SEARCH_ENGINE: ${{ github.event.inputs.engine || 'google' }}
      LINKEDIN_MAX_QUERIES: '120'
      LINKEDIN_COMPANY_ENRICHMENT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: |
          node tests/test_linkedin_public_discovery.mjs
          node tests/test_linkedin_lead_enrichment.mjs
          node tests/test_company_enrichment.mjs
          node tests/test_core.mjs
          node tests/test_discovery.mjs
          node tests/test_ingest.mjs
          node tests/test_sources.mjs
      - name: Discover public LinkedIn decision makers
        run: node run_linkedin_discovery.mjs
      - name: Verify lead snapshot is populated
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('artifacts/linkedin-decision-makers.json','utf8')); if(!Array.isArray(x.leads)||x.leads.length===0) process.exit(1); console.log('LinkedIn leads:',x.leads.length)"
      - name: Update cumulative lead archive
        run: node archive_discovery.mjs
      - name: Upload lead exports
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-public-decision-makers
          path: |
            artifacts/linkedin-decision-makers.json
            artifacts/linkedin-decision-makers.csv
            artifacts/linkedin-decision-makers-summary.json
            artifacts/lead-archive.json
          if-no-files-found: error
      - name: Publish latest discovery snapshot and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/linkedin-decision-makers.json artifacts/linkedin-decision-makers.csv artifacts/linkedin-decision-makers-summary.json artifacts/lead-archive.json
          git diff --cached --quiet || git commit -m "chore: refresh LinkedIn decision-maker discovery archive [skip ci]"
          git push
