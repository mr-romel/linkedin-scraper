name: Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pytest
      - run: PYTHONPATH=. pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_core.mjs tests/test_discovery.mjs tests/test_ingest.mjs tests/test_sources.mjs
      - run: node discover_sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-discovery-results
          path: artifacts/public-discovery*.json
          if-no-files-found: error
