name: Google Deep Public Lead Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['artifacts/**']
  schedule:
    - cron: '17 8 * * 1-5'

concurrency:
  group: google-deep-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEP_LEAD_LIMIT: '500'
      DEEP_DOMAIN_LIMIT: '300'
      DEEP_MAX_QUERIES: '160'
      DEEP_CRAWL_DOMAINS: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deep public discovery
        run: node run_deep_discovery.mjs
      - name: Verify deep snapshot
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('artifacts/google-deep-discovery.json','utf8')); if(!Array.isArray(x.leads)||!Array.isArray(x.domains)) process.exit(1); console.log('Deep leads:',x.leads.length,'domains:',x.domains.length)"
      - name: Update cumulative lead archive
        run: node archive_discovery.mjs
      - name: Upload deep exports
        uses: actions/upload-artifact@v4
        with:
          name: google-deep-public-discovery
          path: |
            artifacts/google-deep-discovery.json
            artifacts/google-deep-discovery-summary.json
            artifacts/lead-archive.json
          if-no-files-found: error
      - name: Publish deep snapshot and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/google-deep-discovery.json artifacts/google-deep-discovery-summary.json artifacts/lead-archive.json
          git diff --cached --quiet || git commit -m "chore: refresh Google deep discovery archive [skip ci]"
          git push
