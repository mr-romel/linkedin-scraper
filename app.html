<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>خيرت Leads</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}main{max-width:900px;margin:auto;padding:16px}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:8px}button{cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px;box-shadow:0 1px 4px #ccc}.muted{color:#666;font-size:13px}pre{white-space:pre-wrap;font-family:Arial}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style><main><h2>خيرت — Leads</h2><div class="card form"><div class="grid"><input id="first" placeholder="الاسم الأول"><input id="last" placeholder="اسم العائلة"><input id="role" placeholder="المنصب"><input id="company" placeholder="الشركة"><input id="industry" placeholder="النشاط"><input id="email" placeholder="Email"><input id="linkedin" placeholder="LinkedIn URL"><select id="permission"><option value="">Marketing Permission</option><option>YES</option><option>NO</option></select></div><button onclick="add()">إضافة Lead</button></div><div class="card"><div class="tools"><button onclick="exportData()">تصدير البيانات</button><button onclick="importData()">استيراد البيانات</button></div><input type="file" id="importFile" accept="application/json" hidden><input id="search" placeholder="بحث"><select id="filter"><option>All</option><option>New</option><option>Qualified</option><option>Email Ready</option><option>Sent</option><option>Replied</option><option>Interested</option><option>Meeting</option><option>Proposal</option><option>Won</option><option>Lost</option></select><div id="count" class="muted"></div></div><section id="list"></section></main><script type="module" src="app.js"></script></html>
