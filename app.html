<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خيرت Leads</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}main{max-width:900px;margin:auto;padding:16px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:8px}button{cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.card{background:white;padding:12px;margin:10px 0;border-radius:10px;box-shadow:0 1px 4px #ccc}.muted{color:#666;font-size:13px}</style><main><h2>خيرت — Leads</h2><div class="card"><div class="grid"><input id="first" placeholder="الاسم الأول"><input id="last" placeholder="اسم العائلة"><input id="role" placeholder="المنصب"><input id="company" placeholder="الشركة"><input id="industry" placeholder="النشاط"><input id="email" placeholder="Email"><input id="linkedin" placeholder="LinkedIn URL"><select id="permission"><option value="">Marketing Permission</option><option>YES</option><option>NO</option></select></div><button onclick="add()">إضافة Lead</button></div><div class="card"><input id="search" placeholder="بحث" oninput="render()"><select id="filter" onchange="render()"><option>All</option><option>New</option><option>Email Ready</option><option>Sent</option><option>Replied</option><option>Interested</option><option>Won</option><option>Lost</option></select></div><section id="list"></section></main><script>const K='khyrat_leads_v1';let leads=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(leads))}function add(){let l={id:crypto.randomUUID(),first_name:$('first').value.trim(),last_name:$('last').value.trim(),role:$('role').value.trim(),company:$('company').value.trim(),industry:$('industry').value.trim(),email:$('email').value.trim(),linkedin_url:$('linkedin').value.trim(),permission:$('permission').value,status:'New',subject:'',body:'',sent_at:'',message_id:''};if(!l.company)return alert('اكتب اسم الشركة');leads.unshift(l);save();document.querySelectorAll('input').forEach(x=>x.value='');$('permission').value='';render()}function draft(l){let n=l.first_name||'أستاذ/أستاذة';l.subject='ملاحظة قانونية سريعة لـ '+l.company;l.body=`أستاذ ${n}،\n\nبحكم نشاط ${l.company}، مع التوسع تظهر نقاط تعاقدية تستحق المراجعة قبل أن تتحول لمشكلة.\n\nأنا محمود خيرت، محامي بالاستئناف ومتخصص في العقود والشئون القانونية للشركات. أقدر أراجع عقد محدد أو أقيّم مشكلة قانونية وأوضح المخاطر والتعديلات المقترحة.\n\nلو مناسب، ابعتلي العقد أو وصف مختصر للمشكلة ونحدد أنسب مستوى للخدمة.\n\nمحمود خيرت`;l.status='Email Ready';save();render()}function removeLead(id){if(confirm('حذف Lead؟')){leads=leads.filter(x=>x.id!==id);save();render()}}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;list.innerHTML=leads.filter(l=>(f==='All'||l.status===f)&&JSON.stringify(l).toLowerCase().includes(q)).map(l=>`<div class="card"><b>${l.first_name} ${l.last_name}</b> — ${l.role||'بدون منصب'}<br><b>${l.company}</b> <span class="muted">${l.industry||''}</span><br>${l.email||'بدون بريد'}<br><span class="muted">${l.status} | Permission: ${l.permission||'—'}</span>${l.subject?`<hr><b>${l.subject}</b><pre style="white-space:pre-wrap">${l.body}</pre>`:''}<div class="grid"><button onclick='draft(leads.find(x=>x.id==="${l.id}"))'>Generate Draft</button><button onclick='removeLead("${l.id}")'>Delete</button></div></div>`).join('')||'<p>لا توجد Leads</p>'}render()</script></html>
