<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>خيرت — إدارة العملاء المحتملين</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}main{max-width:900px;margin:auto;padding:16px}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:8px}button{cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px;box-shadow:0 1px 4px #ccc}.muted{color:#666;font-size:13px}pre{white-space:pre-wrap;font-family:Arial}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lead-check{width:auto}.topbar{display:flex;gap:8px;align-items:center}.topbar select{max-width:180px}</style><main><div class="topbar"><h2 style="margin:8px 0;flex:1">خيرت — إدارة العملاء المحتملين</h2><select id="language" aria-label="لغة العرض"><option value="ar">العربية</option><option value="en">English</option></select></div><div class="card form"><div class="grid"><input id="first" placeholder="الاسم الأول"><input id="last" placeholder="اسم العائلة"><input id="role" placeholder="المنصب"><input id="company" placeholder="الشركة"><input id="industry" placeholder="النشاط"><input id="email" placeholder="البريد الإلكتروني"><input id="linkedin" placeholder="رابط لينكدإن"><select id="source"><option value="">مصدر العميل المحتمل</option><option value="website">موقع الشركة</option><option value="business_directory">دليل شركات</option><option value="referral">إحالة</option><option value="public_company_page">صفحة شركة عامة</option><option value="manual">إدخال يدوي</option><option value="consented_import">استيراد بموافقة</option></select><select id="permission"><option value="">إذن التسويق</option><option>YES</option><option>NO</option></select><input id="permissionSource" placeholder="مصدر الإذن / الموافقة"><input id="permissionAt" type="datetime-local"></div><button onclick="add()">إضافة عميل محتمل</button></div><div class="card"><div class="tools"><button onclick="showDashboard()">لوحة المتابعة</button><button onclick="showDue()">المتابعات المستحقة</button><button onclick="sendNextBatch()">تحديد الدفعة التالية</button><button onclick="exportData()">تصدير بيانات JSON</button><button onclick="exportCSV()">تصدير بيانات CSV</button><button onclick="importData()">استيراد بيانات JSON</button><button onclick="importCSV()">استيراد بيانات CSV</button><button onclick="setEndpoint()">إعداد رابط الإرسال</button><button onclick="sendSelected()">إرسال المحدد (حد أقصى 5)</button></div><div class="muted">الإرسال يتم عبر خدمة بريد منفصلة؛ التطبيق لا يخزن كلمة مرور البريد، ولا تتحول الحالة إلى «تم الإرسال» إلا بعد نجاح الإرسال وعودة معرّف الرسالة</div><input type="file" id="importFile" accept="application/json" hidden><input type="file" id="importCSVFile" accept=".csv,text/csv" hidden><input id="search" placeholder="بحث"><select id="filter"><option>All</option><option>New</option><option>Qualified</option><option>Email Ready</option><option>Sent</option><option>Replied</option><option>Interested</option><option>Meeting</option><option>Proposal</option><option>Won</option><option>Lost</option></select><div id="count" class="muted"></div></div><section id="list"></section></main><script type="module" src="app.js"></script>
